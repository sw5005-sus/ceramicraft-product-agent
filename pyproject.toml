[project]
name = "ceramicraft-product-agent"
version = "0.1.0"
description = "AI-powered product agent for generating descriptions, promotions, categorization, and images for CeramiCraft"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "langgraph>=0.0.10",
    "langchain-google-genai>=1.0.0",
    "google-generativeai>=0.5.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "bandit>=1.7.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "S", "I"]
ignore = ["D100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
omit = [
    "tests/**/*",
    ".github/**/*"
]
